name: Materialize Production UI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize repaired production overlay
        shell: bash
        run: |
          rm -rf production-overrides /tmp/production-ui
          mkdir -p /tmp/production-ui production-overrides
          cat qa/production-ui.part* | tr -d '\r\n' | base64 --decode > /tmp/production-ui.zip
          unzip -tq /tmp/production-ui.zip
          unzip -oq /tmp/production-ui.zip -d /tmp/production-ui
          cp -a /tmp/production-ui/. production-overrides/
          find production-overrides -type f | sort
          git config user.name "REMINDER CI"
          git config user.email "actions@users.noreply.github.com"
          git add production-overrides
          if git diff --cached --quiet; then
            echo "Already materialized"
            exit 0
          fi
          git commit -m "Materialize production UI source"
          git push
