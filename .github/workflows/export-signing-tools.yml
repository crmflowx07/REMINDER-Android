name: Export Android Signing Tools

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Package apksigner and zipalign
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "Using $BT"
          mkdir -p signing-tools
          cp "$BT/apksigner" signing-tools/
          cp "$BT/zipalign" signing-tools/
          cp -R "$BT/lib" signing-tools/
      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: signing-tools
          if-no-files-found: error
