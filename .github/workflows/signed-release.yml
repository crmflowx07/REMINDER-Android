name: Signed Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing RELEASE_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing RELEASE_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing RELEASE_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing RELEASE_KEY_PASSWORD" && exit 1)

      - name: Restore Android source
        shell: bash
        run: |
          base64 --decode source/reminder-source.zip.b64 > /tmp/reminder-source.zip
          echo "8f9625a909cf964e1161e612aba93fb0385b92c3bd06bf1c37b28622df6839f6  /tmp/reminder-source.zip" | sha256sum -c -
          unzip -oq /tmp/reminder-source.zip -d .
          if [ -d overrides ]; then
            cp -a overrides/. .
          fi
          if [ -f qa/REMINDER_UI_QA_OVERRIDES.zip ]; then
            unzip -oq qa/REMINDER_UI_QA_OVERRIDES.zip -d .
            echo "Applied full UI QA overrides"
          fi
          if compgen -G "qa/production-ui.part*" > /dev/null; then
            cat qa/production-ui.part* | tr -d '\r\n' | base64 --decode > /tmp/production-ui.zip
            echo "675aaeb4351971560a17553317c5282b133aec34bc367923dd40024c9d76ad4c  /tmp/production-ui.zip" | sha256sum -c -
            unzip -oq /tmp/production-ui.zip -d .
            echo "Applied production UI pass"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p signing
          echo "$KEYSTORE_B64" | base64 --decode > signing/reminder-release.jks
          cat > keystore.properties <<EOF
          storeFile=signing/reminder-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p release
          cp "$APK" "release/REMINDER-1.0.1-release.apk"
          sha256sum "release/REMINDER-1.0.1-release.apk" > "release/REMINDER-1.0.1-release.apk.sha256"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: REMINDER-1.0.1-signed
          path: |
            release/REMINDER-1.0.1-release.apk
            release/REMINDER-1.0.1-release.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/REMINDER-1.0.1-release.apk
            release/REMINDER-1.0.1-release.apk.sha256
          generate_release_notes: true
