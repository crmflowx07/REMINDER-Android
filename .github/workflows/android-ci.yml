name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android source
        shell: bash
        run: |
          base64 --decode source/reminder-source.zip.b64 > /tmp/reminder-source.zip
          echo "8f9625a909cf964e1161e612aba93fb0385b92c3bd06bf1c37b28622df6839f6  /tmp/reminder-source.zip" | sha256sum -c -
          unzip -oq /tmp/reminder-source.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug and unsigned release APKs
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Upload QA APKs
        uses: actions/upload-artifact@v4
        with:
          name: REMINDER-QA-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
