name: Build AI GYM APK
on:
  push:
    branches: [main]
    paths:
      - 'ai-gym-app/**'
      - '.github/workflows/ai-gym-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai-gym-app/**'
      - '.github/workflows/ai-gym-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle -p ai-gym-app :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp ai-gym-app/app/build/outputs/apk/debug/app-debug.apk AI-GYM-1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AI-GYM-APK
          path: AI-GYM-1.0.0.apk
          if-no-files-found: error
