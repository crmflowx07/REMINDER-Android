name: Build Property Return Filer APK
on:
  workflow_dispatch:
  push:
    branches: [ property-return-filer ]
    paths:
      - 'property-return-filer/**'
      - '.github/workflows/property-return-filer.yml'
  pull_request:
    paths:
      - 'property-return-filer/**'
      - '.github/workflows/property-return-filer.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses >/dev/null || true
          $SDKMANAGER "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: UI and Code QA
        run: gradle -p property-return-filer :app:lintDebug
      - name: Build APK
        run: gradle -p property-return-filer :app:assembleDebug
      - name: Android emulator smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -e
            adb install -r property-return-filer/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.muzamil.fbrreturnfiler.clean/com.muzamil.propertyreturnfiler.MainActivity
            sleep 3
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
            echo "=== SPLASH UI ==="
            cat /tmp/window.xml
            adb shell input tap 540 1450
            sleep 1
            adb shell input tap 540 1550
            sleep 1
            adb shell input tap 540 1650
            sleep 1
            adb shell input tap 540 1750
            sleep 4
            adb shell uiautomator dump /sdcard/dashboard.xml >/dev/null
            adb pull /sdcard/dashboard.xml /tmp/dashboard.xml >/dev/null
            echo "=== AFTER TAP UI ==="
            cat /tmp/dashboard.xml
            grep -E -q "Total Clients|Good Morning|Quick Actions" /tmp/dashboard.xml
            if adb logcat -d | grep -E "FATAL EXCEPTION|Process: com.muzamil.fbrreturnfiler.clean" | grep -q .; then
              adb logcat -d
              exit 1
            fi
      - uses: actions/upload-artifact@v4
        with:
          name: FBR-Return-Filer-Premium-UI-QA-APK
          path: property-return-filer/app/build/outputs/apk/debug/app-debug.apk
