name: Build Property Return Filer APK
on:
  workflow_dispatch:
  push:
    branches: [ property-return-filer ]
    paths:
      - 'property-return-filer/**'
      - '.github/workflows/property-return-filer.yml'
  pull_request:
    paths:
      - 'property-return-filer/**'
      - '.github/workflows/property-return-filer.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses >/dev/null || true
          $SDKMANAGER "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: UI and Code QA
        run: gradle -p property-return-filer :app:lintDebug
      - name: Build APK
        run: gradle -p property-return-filer :app:assembleDebug
      - name: Android emulator smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            adb install -r property-return-filer/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.muzamil.fbrreturnfiler.clean/com.muzamil.propertyreturnfiler.MainActivity
            sleep 3
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
            python3 - <<'PY'
            import re, subprocess, sys
            xml=open('/tmp/window.xml',encoding='utf-8').read()
            m=re.search(r'text="Get Started[^"]*"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',xml)
            if not m:
                print(xml)
                raise SystemExit("Get Started button not found")
            x1,y1,x2,y2=map(int,m.groups())
            subprocess.check_call(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)])
            PY
            sleep 4
            adb shell uiautomator dump /sdcard/dashboard.xml >/dev/null
            adb pull /sdcard/dashboard.xml /tmp/dashboard.xml >/dev/null
            grep -q "Total Clients" /tmp/dashboard.xml
            if adb logcat -d | grep -E "FATAL EXCEPTION|Process: com.muzamil.fbrreturnfiler.clean" | grep -q .; then
              adb logcat -d
              exit 1
            fi
      - uses: actions/upload-artifact@v4
        with:
          name: FBR-Return-Filer-Premium-UI-QA-APK
          path: property-return-filer/app/build/outputs/apk/debug/app-debug.apk
