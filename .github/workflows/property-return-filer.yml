name: Build Property Return Filer APK
on:
  workflow_dispatch:
  push:
    branches: [ property-return-filer ]
    paths:
      - 'property-return-filer/**'
      - '.github/workflows/property-return-filer.yml'
  pull_request:
    paths:
      - 'property-return-filer/**'
      - '.github/workflows/property-return-filer.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses >/dev/null || true
          $SDKMANAGER "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: UI and Code QA
        run: gradle -p property-return-filer :app:lintDebug
      - name: Build APK
        run: gradle -p property-return-filer :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FBR-Return-Filer-Premium-UI-QA-APK
          path: property-return-filer/app/build/outputs/apk/debug/app-debug.apk
