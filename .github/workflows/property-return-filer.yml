name: Build Property Return Filer APK
on:
  workflow_dispatch:
  push:
    branches: [ property-return-filer ]
    paths:
      - 'property-return-filer/**'
      - '.github/workflows/property-return-filer.yml'
  pull_request:
    paths:
      - 'property-return-filer/**'
      - '.github/workflows/property-return-filer.yml'
jobs:
  build-and-runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses >/dev/null || true
          $SDKMANAGER "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Static QA
        run: |
          gradle -p property-return-filer :app:lintDebug
          gradle -p property-return-filer :app:assembleDebug
          unzip -t property-return-filer/app/build/outputs/apk/debug/app-debug.apk
      - name: Pixel emulator runtime QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            APK=property-return-filer/app/build/outputs/apk/debug/app-debug.apk
            PKG=com.muzamil.fbrreturnfiler.v7
            ACT=com.muzamil.propertyreturnfiler.MainActivity

            adb uninstall "$PKG" >/dev/null 2>&1 || true
            adb install "$APK"
            adb shell pm clear "$PKG" >/dev/null || true
            adb logcat -c
            adb shell am start -W -n "$PKG/$ACT"
            sleep 3

            adb shell uiautomator dump /sdcard/splash.xml >/dev/null
            adb pull /sdcard/splash.xml splash.xml >/dev/null
            grep -q "FBR Return Filer" splash.xml
            grep -q "Get Started" splash.xml

            python3 - <<'PY'
            import re,sys
            x=open('splash.xml',encoding='utf-8').read()
            nodes=re.findall(r'<node[^>]+>',x)
            for n in nodes:
                if 'Get Started' in n:
                    m=re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',n)
                    if m:
                        x1,y1,x2,y2=map(int,m.groups())
                        open('tap.txt','w').write(f"{(x1+x2)//2} {(y1+y2)//2}")
                        sys.exit(0)
            sys.exit('Get Started bounds not found')
            PY
            read X Y < tap.txt
            adb shell input tap "$X" "$Y"
            sleep 4

            adb shell uiautomator dump /sdcard/dashboard.xml >/dev/null
            adb pull /sdcard/dashboard.xml dashboard.xml >/dev/null
            grep -q "Good Morning" dashboard.xml
            grep -q "Total Clients" dashboard.xml
            grep -q "Quick Actions" dashboard.xml

            if adb logcat -d -v time | grep -E "FATAL EXCEPTION|Process: $PKG" | grep -q .; then
              adb logcat -d -v time
              exit 1
            fi

            # Verify Clients navigation works.
            python3 - <<'PY'
            import re,sys
            x=open('dashboard.xml',encoding='utf-8').read()
            for n in re.findall(r'<node[^>]+>',x):
                if 'text="Clients"' in n:
                    m=re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',n)
                    if m:
                        x1,y1,x2,y2=map(int,m.groups());open('tap_clients.txt','w').write(f"{(x1+x2)//2} {(y1+y2)//2}");sys.exit(0)
            sys.exit('Clients nav not found')
            PY
            read X Y < tap_clients.txt
            adb shell input tap "$X" "$Y"
            sleep 2
            adb shell uiautomator dump /sdcard/clients.xml >/dev/null
            adb pull /sdcard/clients.xml clients.xml >/dev/null
            grep -q "Search by name" clients.xml
            grep -q "Ahmed Raza" clients.xml

            if adb logcat -d -v time | grep -E "FATAL EXCEPTION|Process: $PKG" | grep -q .; then
              adb logcat -d -v time
              exit 1
            fi
            echo "PASS: fresh install, launch, Get Started, Dashboard and Clients all runtime-tested on API 29"

      - uses: actions/upload-artifact@v4
        with:
          name: FBR-Return-Filer-Runtime-Tested-APK
          path: property-return-filer/app/build/outputs/apk/debug/app-debug.apk
