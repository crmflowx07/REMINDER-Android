name: Build Property Return Filer APK
on:
  workflow_dispatch:
  push:
    branches: [ property-return-filer ]
    paths:
      - 'property-return-filer/**'
      - '.github/workflows/property-return-filer.yml'
  pull_request:
    paths:
      - 'property-return-filer/**'
      - '.github/workflows/property-return-filer.yml'
jobs:
  build-and-runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses >/dev/null || true
          $SDKMANAGER "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Static QA
        run: |
          gradle -p property-return-filer :app:lintDebug
          gradle -p property-return-filer :app:testDebugUnitTest || {
            echo "=== UNIT TEST FAILURE DETAILS ==="
            cat property-return-filer/app/build/test-results/testDebugUnitTest/*.xml || true
            exit 1
          }
          gradle -p property-return-filer :app:assembleDebug
          unzip -t property-return-filer/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FBR-Return-Filer-V8-QA-Passed-APK
          path: property-return-filer/app/build/outputs/apk/debug/app-debug.apk

  device-touch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK for device test
        run: gradle -p property-return-filer :app:assembleDebug
      - name: Android 9 Pixel real tap QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            cat > /tmp/fbr-device-test.sh <<'BASH'
            set -eu
            APK="property-return-filer/app/build/outputs/apk/debug/app-debug.apk"
            PKG="com.muzamil.fbrreturnfiler.v7"
            ACT="com.muzamil.propertyreturnfiler.MainActivity"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop "$PKG"
            adb shell am start -W -n "$PKG/$ACT"
            sleep 2
            adb shell uiautomator dump /sdcard/splash.xml >/dev/null
            adb pull /sdcard/splash.xml splash.xml >/dev/null
            grep -q "Get Started" splash.xml
            python3 - <<'PY'
            import re,sys
            x=open('splash.xml',encoding='utf-8').read()
            for n in re.findall(r'<node[^>]+>',x):
                if 'Get Started' in n:
                    m=re.search(r'bounds="\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]"',n)
                    if m:
                        a,b,c,d=map(int,m.groups())
                        open('tap.txt','w').write(f"{(a+c)//2} {(b+d)//2}")
                        sys.exit(0)
            raise SystemExit('Get Started bounds not found')
            PY
            read X Y < tap.txt
            adb shell input tap "$X" "$Y"
            sleep 3
            adb shell uiautomator dump /sdcard/dashboard.xml >/dev/null
            adb pull /sdcard/dashboard.xml dashboard.xml >/dev/null
            grep -q "Good Morning" dashboard.xml
            grep -q "Total Clients" dashboard.xml
            grep -q "Quick Actions" dashboard.xml
            if adb logcat -d | grep -E "FATAL EXCEPTION|Process: $PKG" | grep -q .; then
              adb logcat -d
              exit 1
            fi
            echo "PASS: Physical Get Started tap opened dashboard"
            BASH
            bash /tmp/fbr-device-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FBR-Return-Filer-V8-Real-Tap-Tested-APK
          path: property-return-filer/app/build/outputs/apk/debug/app-debug.apk
