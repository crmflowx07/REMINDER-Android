name: FBR Device Runtime QA
on:
  workflow_dispatch:
  push:
    branches: [ property-return-filer ]
    paths:
      - 'property-return-filer/**'
      - '.github/workflows/fbr-device-qa.yml'
jobs:
  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p property-return-filer :app:assembleDebug
      - name: Android 9 Pixel touch test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            set -euo pipefail
            APK=property-return-filer/app/build/outputs/apk/debug/app-debug.apk
            PKG=com.muzamil.fbrreturnfiler.v7
            ACT=com.muzamil.propertyreturnfiler.MainActivity
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop "$PKG"
            adb shell am start -W -n "$PKG/$ACT"
            sleep 2
            adb shell uiautomator dump /sdcard/splash.xml >/dev/null
            adb pull /sdcard/splash.xml splash.xml >/dev/null
            grep -q "Get Started" splash.xml
            python3 - <<'PY'
            import re,sys
            x=open('splash.xml',encoding='utf-8').read()
            for n in re.findall(r'<node[^>]+>',x):
                if 'Get Started' in n:
                    m=re.search(r'bounds="\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]"',n)
                    if m:
                        a,b,c,d=map(int,m.groups())
                        open('tap.txt','w').write(f"{(a+c)//2} {(b+d)//2}")
                        sys.exit(0)
            raise SystemExit('Get Started bounds not found')
            PY
            read X Y < tap.txt
            adb shell input tap "$X" "$Y"
            sleep 3
            adb shell uiautomator dump /sdcard/dashboard.xml >/dev/null
            adb pull /sdcard/dashboard.xml dashboard.xml >/dev/null
            grep -q "Good Morning" dashboard.xml
            grep -q "Total Clients" dashboard.xml
            grep -q "Quick Actions" dashboard.xml
            if adb logcat -d | grep -E "FATAL EXCEPTION|Process: $PKG" | grep -q .; then
              adb logcat -d
              exit 1
            fi
            echo "DEVICE QA PASS: Get Started opens dashboard"
      - uses: actions/upload-artifact@v4
        with:
          name: FBR-Return-Filer-V7-Device-Tested-APK
          path: property-return-filer/app/build/outputs/apk/debug/app-debug.apk
