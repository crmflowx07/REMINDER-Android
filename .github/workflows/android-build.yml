name: Android Build QA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q source/REMINDER-source.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        working-directory: project
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Build unsigned release APK
        working-directory: project
        run: gradle assembleRelease --stacktrace

      - name: Upload QA APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: REMINDER-QA-APKs
          path: |
            project/app/build/outputs/apk/debug/*.apk
            project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
