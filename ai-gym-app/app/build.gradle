plugins { id 'com.android.application' }

android {
    namespace 'com.aigym.fit'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aigym.fit'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
